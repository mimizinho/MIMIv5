<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar no MIMI</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff5f8;color:#4a3b45;font-family:sans-serif;text-align:center;padding:24px}
button,a.btn{background:#ff6fa5;color:#fff;border:0;border-radius:24px;padding:14px 28px;font-size:16px;text-decoration:none;display:inline-block}
#voltar{display:none}
#msg{font-size:14px;max-width:320px}
</style></head>
<body>
<h3>Entrar no MIMI com Google</h3>
<button id="entrar">Entrar com Google</button>
<a id="voltar" class="btn" href="#">Voltar ao app</a>
<p id="msg"></p>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var CLIENT_ID="658875273173-dbpr9983gtjat00mnnmj13k36fq1194e.apps.googleusercontent.com";
var msg=document.getElementById("msg");
document.getElementById("entrar").onclick=function(){
  if(typeof google==="undefined"||!google.accounts||!google.accounts.oauth2){
    msg.textContent="O script do Google não carregou. Verifique a conexão e tente de novo.";
    return;
  }
  var tc=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:"openid email profile",
    callback:function(r){
      if(!r||r.error||!r.access_token){msg.textContent="Login cancelado ou falhou.";return;}
      var url="mimi://login?token="+encodeURIComponent(r.access_token);
      var a=document.getElementById("voltar");
      a.href=url;a.style.display="inline-block";
      msg.textContent="Pronto! Se o app não abrir sozinho, toque em Voltar ao app.";
      location.href=url;
    },
    error_callback:function(){
      msg.textContent="Login bloqueado ou cancelado. Verifique o bloqueador de pop-up.";
    }
  });
  tc.requestAccessToken();
};
</script>
</body>
</html>
