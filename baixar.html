<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff6fa5">
<title>Baixar o MIMI</title>
<link rel="icon" href="icons/icon-192x192.png">
<style>
:root{--bg:#fff5f8;--card:#fff;--border:#ffe0ec;--accent:#ff6fa5;--pink:#ff4d8d;--text:#4a3b45;--sub:#b08a9c}
@media (prefers-color-scheme:dark){:root{--bg:#1a1020;--card:#251830;--border:#3a2545;--text:#f0e0ea;--sub:#c49ab8}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 8px 30px rgba(255,111,165,.15)}
.card img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(255,77,141,.3)}
h1{margin:16px 0 4px;font-size:28px}
p{margin:0 0 24px;color:var(--sub);font-size:15px}
.btn{display:block;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;font-weight:700;font-size:17px;text-decoration:none;box-shadow:0 6px 16px rgba(255,77,141,.35)}
.btn:active{transform:scale(.98)}
small{display:block;margin-top:18px;color:var(--sub);font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<img src="icons/icon-192x192.png" alt="MIMI">
<h1>MIMI</h1>
<p>Baixe o app para Android</p>
<a class="btn" href="https://github.com/mimizinho/MIMIv5/releases/latest/download/MIMI.apk">Baixar o app</a>
<small>Depois de baixar, abra o arquivo. Se o Android pedir, permita a instalação deste app.</small>
</div>
</body>
</html>
